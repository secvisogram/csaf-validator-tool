# Static server for the built app. Reached only through the gateway.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # The gateway rewrites nothing, so a redirect must not name this host.
  absolute_redirect off;

  # No fallback to index.html: unknown paths must answer 404. The app treats a
  # missing runtime config (404) as "no configuration", and an index.html
  # there as invalid content.
}
