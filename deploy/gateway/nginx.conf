# The only browser-facing server of the Compose deployment.
# It serves the app, proxies /api/v1/ and /health to the JavaScript validator
# and /rust/api/v1/ to the Rust validator, and answers /healthz itself. Nothing
# else is proxied. Document URLs entered by users are
# fetched by the browser and never pass through here.

# Upstream names are resolved per request through Docker's DNS, because the
# upstream addresses are variables. nginx therefore starts when the validator
# is stopped, and finds it again after a restart.
resolver 127.0.0.11 valid=5s ipv6=off;

server {
  listen 80;
  server_name _;

  client_max_body_size 50m;

  set $app http://app:80;
  set $validator http://validator-js:8082;
  set $validator_health http://validator-js:8082/health;
  set $validator_rust http://validator-rust:8082;

  # Gateway readiness only. It says nothing about the validator.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Upstream health, as the validator itself reports it.
  location = /health {
    proxy_pass $validator_health;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
    error_page 502 503 = @validator_unavailable;
    error_page 504 = @validator_timeout;
  }

  # The path is passed on unchanged. The read timeout is above the 120 s
  # request timeout of the app, so the app's own message wins over a 504.
  location /api/v1/ {
    proxy_pass $validator;
    proxy_connect_timeout 5s;
    proxy_read_timeout 130s;
    proxy_send_timeout 130s;
    error_page 502 503 = @validator_unavailable;
    error_page 504 = @validator_timeout;
  }

  # The prefix is stripped, so /rust/api/v1/validate and /rust/api/v1/health
  # reach the same paths upstream. With a variable in proxy_pass, the rewritten
  # URI is what is sent. Same limits and failure answers as the route above.
  location /rust/api/v1/ {
    rewrite ^/rust(/.*)$ $1 break;
    proxy_pass $validator_rust;
    proxy_connect_timeout 5s;
    proxy_read_timeout 130s;
    proxy_send_timeout 130s;
    error_page 502 503 = @validator_unavailable;
    error_page 504 = @validator_timeout;
  }

  location / {
    proxy_pass $app;
  }

  # Refused connection or failed name lookup: the validator is stopped.
  location @validator_unavailable {
    default_type application/json;
    return 502 '{"message":"The validator service is not reachable through the gateway."}\n';
  }

  # Connection accepted but no answer in time: the validator is hung.
  location @validator_timeout {
    default_type application/json;
    return 504 '{"message":"The validator service did not answer through the gateway in time."}\n';
  }
}
