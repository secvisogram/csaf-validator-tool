name: Release
# Publishes the static app to GitHub Pages when a GitHub Release is published,
# and never for a pull request or a push. The Pages source of the repository
# is "GitHub Actions". Safari is a manual gate: docs/release-checklist.md.
on:
  release:
    types:
      - published
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml
  build:
    name: Build
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload the static app
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
