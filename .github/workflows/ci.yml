name: CI
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build
      - name: Check the Compose setup
        run: docker compose config --quiet
      - name: Build the Compose images and check the nginx configuration
        run: |
          docker compose build app gateway
          docker compose run --rm --no-deps --entrypoint nginx app -t
          docker compose run --rm --no-deps --entrypoint nginx gateway -t
