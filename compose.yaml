# Local deployment: the app and the two validator services (a pinned JavaScript
# image and a Rust service built from a submodule) behind one loopback-only
# gateway. See README.md ("Local deployment").
services:
  app:
    build:
      context: .
      dockerfile: deploy/app/Dockerfile
    networks: [private]
    restart: unless-stopped

  validator-js:
    # The reviewed, immutable digest (csaf-validator-service 3.0.5, linux/amd64,
    # resolved 2026-11-15). Never built or patched here. See README.md before
    # changing it.
    image: ghcr.io/secvisogram/csaf-validator-service:3.0.6@sha256:2a4a76039ab5091c84c30d6983f632f3f1e0ed6727d994edc81e6060852fbcf7
    networks: [private]
    restart: unless-stopped

  validator-rust:
    # Built from the commit-pinned submodule (upstream tag v0.7.3) with its own
    # Dockerfile, because upstream publishes no image. Needs
    # `git submodule update --init tools/csaf-rs`. Distroless, so there is no
    # healthcheck. No CORS setting: the browser only talks to the gateway.
    build:
      context: tools/csaf-rs
    networks: [private]
    restart: unless-stopped

  gateway:
    build:
      context: deploy/gateway
    # The only published port. Binding to anything but 127.0.0.1 is a deliberate
    # local edit after an exposure review.
    ports:
      - 127.0.0.1:8080:80
    depends_on: [app]
    networks: [private]
    restart: unless-stopped

networks:
  private: {}
