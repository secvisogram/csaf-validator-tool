# Local deployment: the app and the externally maintained JavaScript validator
# service behind one loopback-only gateway. See README.md ("Local deployment").
services:
  app:
    build:
      context: .
      dockerfile: deploy/app/Dockerfile
    networks: [private]
    restart: unless-stopped

  validator-js:
    # The reviewed, immutable digest (csaf-validator-service 3.0.5, linux/amd64,
    # resolved 2026-11-15). Never built or patched here. See README.md before
    # changing it.
    image: ghcr.io/secvisogram/csaf-validator-service@sha256:e09b8a2b7c7715cce3de2144d73789a06df85a3d116ff07229199060f2e6e5db
    networks: [private]
    restart: unless-stopped

  gateway:
    build:
      context: deploy/gateway
    # The only published port. Binding to anything but 127.0.0.1 is a deliberate
    # local edit after an exposure review.
    ports:
      - 127.0.0.1:8080:80
    depends_on: [app]
    networks: [private]
    restart: unless-stopped

networks:
  private: {}
